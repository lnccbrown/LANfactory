site_name: LANfactory
site_url: https://lnccbrown.github.io/LANfactory/
repo_name: lnccbrown/LANfactory
repo_url: https://github.com/lnccbrown/LANfactory
edit_uri: edit/main/docs

nav:
  - Home:
      - Overview: index.md
  - Learn:
      - Train your first LAN (PyTorch): basic_tutorial/basic_tutorial_lan_torch.ipynb
  - How-to guides:
      - Train with the JAX backend: basic_tutorial/basic_tutorial_lan_jax.ipynb
      - Export an sbi model to ONNX: tutorials/exporting_sbi_to_onnx.ipynb
      - Export a bayesflow model to ONNX: tutorials/exporting_bayesflow_to_onnx.ipynb
      - Track training runs with MLflow: using_mlflow.md
      - Share trained networks on HuggingFace Hub: using_huggingface.md
  - Explanations:
      - What LANs are, and where LANfactory fits: what_are_lans.md
  - Reference:
      - "Network types: LAN, CPN, OPN": network_types.md
      - sbi export — architectures and constraints: exporting_sbi_models.md
      - bayesflow export — architectures and constraints: exporting_bayesflow_models.md
      - API:
          - config: api/config.md
          - hf: api/hf.md
          - onnx: api/onnx.md
          - trainers: api/trainers.md
          - utils: api/utils.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - autorefs
  - redirects:
      redirect_maps:
        basic_tutorial/basic_tutorial_cpn_torch.md: network_types.md
        basic_tutorial/basic_tutorial_opn_torch.md: network_types.md
  - mkdocs-jupyter:
      execute: True
      execute_ignore:
        - basic_tutorial/basic_tutorial_lan_jax.ipynb
        - basic_tutorial/basic_tutorial_lan_torch.ipynb
        - tutorials/exporting_sbi_to_onnx.ipynb
        - tutorials/exporting_bayesflow_to_onnx.ipynb
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://mkdocstrings.github.io/objects.inv
            - https://mkdocstrings.github.io/griffe/objects.inv
          options:
            separate_signature: true
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: true
            docstring_style: numpy
            docstring_section_style: list
            show_root_members_full_path: true
            show_object_full_path: false
            show_category_heading: false
            show_signature_annotations: true
            show_docstring_attributes: false
            show_source: false
            show_root_heading: true
            group_by_category: true
            signature_crossrefs: false
            summary: true
            line_length: 80
            unwrap_annotated: false
            modernize_annotations: true
            filters:
              - "!^_"

theme:
  logo: images/navlogo.png
  favicon: images/navlogo.png
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.action.view
    - content.action.edit
    - header.autohide
    - announce.dismiss
    - navigation.footer
    - navigation.indexes
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      scheme: ocean
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: ocean
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to automatic mode

copyright: >-
  Copyright &copy; Brown University —
  <a href="https://lnccbrown.github.io/HSSM/">HSSM</a> ·
  <a href="https://lnccbrown.github.io/ssm-simulators/">ssm-simulators</a> ·
  <a href="https://lnccbrown.github.io/LANfactory/">LANfactory</a>

extra:
  homepage: "https://lnccbrown.github.io/LANfactory/"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lnccbrown/LANfactory
    - icon: material/forum
      link: https://github.com/lnccbrown/HSSM/discussions

extra_css:
  - "styles/extra.css"

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
