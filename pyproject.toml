[build-system]
requires = ["setuptools", "wheel"]

[project.urls]
"Homepage" = "https://github.com/lnccbrown/LANFactory"
"Documentation" = "https://lnccbrown.github.io/LANfactory/"
"Bug Tracker" = "https://github.com/lnccbrown/LANFactory/issues"

[project]
name = "lanfactory"
version = "0.9.0"
authors = [
    { name = "Alexander Fengler", email = "alexander_fengler@brown.edu" },
    { name = "Carlos Paniagua", email = "carlos_paniagua@brown.edu" },
    { name = "Hannah Hafner", email = "hhafner@smith.edu" },
]
description = "Package with convenience functions to train LANs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12, <3.15"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Floor tracks the current ssm-simulators release so training data and HSSM
    # (>=0.14.0) agree on simulator semantics: 0.14.0 masks omissions on rts,
    # 0.15.0 declares the response-time support edge (ndt_edge_shift) in model
    # configs. See HSSMSpine#118.
    "ssm-simulators>=0.15.0",
    "scipy>=1.15.2",
    "pandas>=2.2.3",
    "torch>=2.10.0",
    "flax>=0.12.7",
    "tqdm>=4.67.1",
    "frozendict>=2.4.6",
    "onnx>=1.17.0",
    # lanfactory.derive batches published (1, D) graphs through onnxruntime.
    "onnxruntime>=1.17",
    # jax -> ONNX export for jaxtrain networks. Exact-pinned to the 0.15 line:
    # 0.x releases move the API, and the parity test in tests/onnx guards the
    # ecosystem's single-trial ONNX contract against silent changes.
    "jax2onnx>=0.15,<0.18",
    "matplotlib>=3.10.1",
    "plotly>=6.0.0",
    "seaborn>=0.13.2",
    "typer>=0.9.0",
]

keywords = [
    "LANs",
    "generative models",
    "cognitive science",
    "neuroscience",
    "sbi",
]

[project.optional-dependencies]
mlflow = ["mlflow>=3.14.0"]
hf = ["huggingface-hub>=0.20.0"]
sbi = ["sbi>=0.26", "nflows>=0.14"]
bayesflow = ["bayesflow>=2.0.8", "keras>=3.12"]
all = [
    "mlflow>=3.14.0",
    "huggingface-hub>=0.20.0",
    "sbi>=0.26",
    "nflows>=0.14",
    "bayesflow>=2.0.8",
    "keras>=3.12",
]

[dependency-groups]
lint = [
    # ruff moves its default rule set at minor releases (0.16: 59 -> 413 default
    # rules; 0.17 dropped most DTZ rules), so bump the minor deliberately with
    # `ruff check --fix` plus a triage pass of the new findings. Keep the
    # ruff-pre-commit rev in .pre-commit-config.yaml in lockstep.
    "ruff>=0.17,<0.18",
]
dev = [
    "coverage>=7.6.4",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipywidgets>=8.1.2",
    "jupyterlab>=4.2.4",
    "mypy>=1.11.1",
    "nbconvert>=7.16.5",
    "pre-commit>=2.20.0",
    "ptpython>=3.0.29",
    "pytest-cov>=6.1.1",
    "pytest-rerunfailures>=15.1",
    "pytest-timer>=1.0.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.1",
    { include-group = "lint" },
    "types-PyYAML",
    "mlflow>=3.14.0",
    "jaxonnxruntime>=0.3",
    "nflows>=0.14",
    "bayesflow>=2.0.8",
    "keras>=3.12",
    "sbi>=0.26",
    "marimo>=0.23",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.9",
    "mkdocs-jupyter==0.26.3",
    "mkdocs-autorefs==1.4.4",
    # 1.2.3 depends on ProperDocs, which injects an unrelated migration banner.
    "mkdocs-redirects==1.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lanfactory", "lanfactory.*"]


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO" # set minimum log level for console output
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--exitfirst",
    "--timer-top-n=25",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "notebooks: mark test as a notebook test (skipped unless --run-notebooks is passed)",
]

[tool.ruff]
line-length = 88
# Module roots for first-party detection (import sorting). `src` resolves
# `lanfactory`; `.` resolves `tests`. Do not add `tests` itself: `tests/onnx/`
# would make ruff treat the PyPI `onnx` package as first-party.
src = [".", "src"]
extend-exclude = ["notebooks/*", "docs/*", "docs/basic_tutorial/basic_tutorial.ipynb"]

[tool.ruff.lint]
ignore = [
    # Blind `except Exception` is deliberate at the MLflow / HuggingFace /
    # artifact-IO boundaries: tracking and metadata are best-effort and must
    # never abort a training run silently (the error is logged; most sites
    # continue, the two dry-run checks end the run with a non-zero exit).
    "BLE001",
]

[tool.ruff.lint.flake8-bugbear]
# `typer.Option(...)` in a parameter default is typer's declarative CLI API;
# it is evaluated once at import time and is not a mutable-default hazard.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# Coverage settings
[tool.coverage.run]
source = ["src"]
branch = true # Measure branch coverage
parallel = true # Support parallel test execution
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/cli/jax_train.py",   # CLI entry points are tested via smoke tests
    "*/cli/torch_train.py", # CLI entry points are tested via smoke tests
    "*/cli/upload_hf.py",   # CLI entry points are tested via smoke tests
    "*/cli/download_hf.py", # CLI entry points are tested via smoke tests
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "except.*Exception",
    "except.*ImportError",
    "logger.error",
]


[project.scripts]
jaxtrain = "lanfactory.cli.jax_train:app"
torchtrain = "lanfactory.cli.torch_train:app"
transform-onnx = "lanfactory.onnx.transform_onnx:app"
transform-jax-onnx = "lanfactory.onnx.jax_export:app"
upload-hf = "lanfactory.cli.upload_hf:app"
download-hf = "lanfactory.cli.download_hf:app"
derive-aux = "lanfactory.cli.derive_aux:app"

[tool.setuptools.package-data]
"lanfactory.cli" = ["config_network_training_lan.yaml"]
