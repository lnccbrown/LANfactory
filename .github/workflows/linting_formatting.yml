name: Linting and Formatting

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"

      - name: Check styling
        run: uvx ruff format --check .

      - name: Check linting
        run: uvx ruff check src/lanfactory
