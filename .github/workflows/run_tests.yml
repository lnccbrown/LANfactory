name: Run tests

on:
  pull_request:
  workflow_call: # Called by drift.yml (scheduled drift detection)

jobs:
  run_tests:
    runs-on: ubuntu-latest

    strategy:
      # Run every Python version to completion even if one fails, so a single
      # version's failure doesn't cancel the others and hide their real status.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # (a cache-nuking block used to sit here: rm -rf of every cache plus
      # `uv sync --reinstall` with PIP_NO_CACHE_DIR — every PR run cold-
      # downloaded the multi-GB torch/bayesflow/keras/sbi stack, and uv was
      # pinned to the ancient 0.6.5)
      - name: Install package
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest

      - name: Check styling
        run: uv run ruff format --check .

      - name: Linting
        run: uv run ruff check src/lanfactory

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test_notebooks:
    name: Execute tutorial notebooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.5"

      - name: Install package (with notebook + backend deps)
        run: uv sync --all-groups

      # Runs the 4 Jupyter basic tutorials (via nbconvert) and the 2 marimo export
      # tutorials (via `marimo export`) so the tutorials cannot silently drift out
      # of sync with the code again.
      - name: Execute tutorial notebooks
        run: uv run pytest tests/test_notebooks.py --run-notebooks --no-cov -v
