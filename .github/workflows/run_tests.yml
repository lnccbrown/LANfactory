name: Run tests

on:
  pull_request:
  workflow_call: # Called by drift.yml (scheduled drift detection)

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest

    strategy:
      # Run every Python version to completion even if one fails, so a single
      # version's failure doesn't cancel the others and hide their real status.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # (a cache-nuking block used to sit here: rm -rf of every cache plus
      # `uv sync --reinstall` with PIP_NO_CACHE_DIR — every PR run cold-
      # downloaded the multi-GB torch/bayesflow/keras/sbi stack, and uv was
      # pinned to the ancient 0.6.5. It was added during an undiagnosed hour
      # of trial and error in June 2025; the SIGILL it was flailing at came
      # from ssm-simulators' `-march=native` wheels and is pinned out by
      # `ssm-simulators>=0.13.1`. Don't reinstate it on a hunch.)
      - name: Install package
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test_recipe_hssm:
    name: Recipe with HSSM (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install recipe and pinned HSSM consumer
        run: |
          uv sync --all-groups
          # main identifies as 0.5.1 but is not released yet. Pin the consumer
          # used for the development control, rather than a moving branch.
          uv pip install "hssm @ git+https://github.com/lnccbrown/HSSM.git@1f94ce2ba5ed356209134f90a3cc6a6f8414a135"
      - name: Exercise real HSSM load, ONNX gradients and fail-closed gates
        run: >-
          uv run --no-sync pytest tests/test_ssms_recipe.py tests/test_recipe_gradient.py
          -q -o addopts= --cov=lanfactory --cov-branch
          --cov-report=xml:coverage-recipe.xml --cov-report=term-missing
      - name: Upload HSSM integration coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-recipe.xml

  test_notebooks:
    name: Execute tutorial notebooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install package (with notebook + backend deps)
        run: uv sync --all-groups

      # Executes every committed rendered tutorial and every canonical marimo
      # source so the published learning path cannot silently drift from the code.
      - name: Execute tutorial notebooks
        run: uv run pytest tests/test_notebooks.py --run-notebooks --no-cov -v
