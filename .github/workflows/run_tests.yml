name: Run tests

on:
  pull_request:

jobs:
  run_tests:
    runs-on: ubuntu-latest

    strategy:
      # Run every Python version to completion even if one fails, so a single
      # version's failure doesn't cancel the others and hide their real status.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python-version }}
          # enable-cache: true
          # cache-dependency-glob: "pyproject.toml pdm.lock"

      - name: Clear all caches
        run: |
          rm -rf ~/.cache/pip
          rm -rf ~/.cache/uv
          rm -rf ~/.cache/conda
          rm -rf ~/.cache/npm

      - name: Install package
        run: uv sync --all-groups --reinstall
        env:
          # UV_CACHE_DIR: ""
          PIP_NO_CACHE_DIR: "1"

      - name: Run pytest
        run: uv run pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test_notebooks:
    name: Execute tutorial notebooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"

      - name: Install package (with notebook + backend deps)
        run: uv sync --all-groups

      # Runs the 4 Jupyter basic tutorials (via nbconvert) and the 2 marimo export
      # tutorials (via `marimo export`) so the tutorials cannot silently drift out
      # of sync with the code again.
      - name: Execute tutorial notebooks
        run: uv run pytest tests/test_notebooks.py --run-notebooks --no-cov -v
