name: Docs

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - ".github/workflows/reusable-docs.yml"
      - ".lychee.toml"
      - "docs/**"
      - "mkdocs.yml"
      - "notebooks/*.py"
      - "pyproject.toml"
      - "scripts/docs.sh"
      - "src/lanfactory/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - ".github/workflows/reusable-docs.yml"
      - ".lychee.toml"
      - "docs/**"
      - "mkdocs.yml"
      - "notebooks/*.py"
      - "pyproject.toml"
      - "scripts/docs.sh"
      - "src/lanfactory/**"
  schedule:
    # Retain the established Monday 06:17 UTC rendered-link check.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/reusable-docs.yml
    with:
      system-profile: none
